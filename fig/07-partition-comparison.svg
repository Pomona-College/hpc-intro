<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Sagehen partition comparison</title>
  <desc>Comparison of the amd, gpu, and short SLURM partitions on Sagehen</desc>
  <defs>
    <filter id="shp" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- amd card -->
  <g filter="url(#shp)">
    <rect x="20" y="20" width="290" height="380" rx="10" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <rect x="20" y="20" width="290" height="44" rx="10" fill="#004B87"/>
    <rect x="20" y="44" width="290" height="20" fill="#004B87"/>
    <text x="165" y="48" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">amd (default)</text>
    <text x="165" y="94" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">12 nodes: a001 – a012</text>
    <text x="165" y="126" text-anchor="middle" fill="#003366" font-size="13">128 AMD EPYC cores per node</text>
    <text x="165" y="150" text-anchor="middle" fill="#003366" font-size="13">500 GB RAM per node</text>
    <line x1="45" y1="172" x2="285" y2="172" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="165" y="200" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Max walltime: 720 h (30 days)</text>
    <line x1="45" y1="222" x2="285" y2="222" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="165" y="250" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Best for:</text>
    <text x="165" y="274" text-anchor="middle" fill="#003366" font-size="13">Long CPU jobs, simulations,</text>
    <text x="165" y="294" text-anchor="middle" fill="#003366" font-size="13">data processing, multi-node MPI</text>
  </g>

  <!-- gpu card -->
  <g filter="url(#shp)">
    <rect x="335" y="20" width="290" height="380" rx="10" fill="#EAF1F7" stroke="#004B87" stroke-width="2"/>
    <rect x="335" y="20" width="290" height="44" rx="10" fill="#003366"/>
    <rect x="335" y="44" width="290" height="20" fill="#003366"/>
    <text x="480" y="48" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">gpu</text>
    <text x="480" y="94" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">10 GPUs across GPU nodes</text>
    <text x="480" y="126" text-anchor="middle" fill="#003366" font-size="13">4&#215; A100 80 GB &#8226; 4&#215; L40S 48 GB</text>
    <text x="480" y="150" text-anchor="middle" fill="#003366" font-size="13">2&#215; RTX PRO 6000 96 GB</text>
    <line x1="360" y1="172" x2="600" y2="172" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="480" y="200" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Max walltime: 720 h (30 days)</text>
    <line x1="360" y1="222" x2="600" y2="222" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="480" y="250" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Best for:</text>
    <text x="480" y="274" text-anchor="middle" fill="#003366" font-size="13">Machine learning, CUDA code,</text>
    <text x="480" y="294" text-anchor="middle" fill="#003366" font-size="13">GPU-accelerated computing</text>
    <text x="480" y="330" text-anchor="middle" fill="#666" font-size="12" font-style="italic">128 cores + 500 GB RAM per node</text>
  </g>

  <!-- short card -->
  <g filter="url(#shp)">
    <rect x="650" y="20" width="290" height="380" rx="10" fill="#FBF4E2" stroke="#D4A843" stroke-width="2"/>
    <rect x="650" y="20" width="290" height="44" rx="10" fill="#D4A843"/>
    <rect x="650" y="44" width="290" height="20" fill="#D4A843"/>
    <text x="795" y="48" text-anchor="middle" fill="#000" font-size="16" font-weight="bold">short</text>
    <text x="795" y="94" text-anchor="middle" fill="#003366" font-size="14" font-weight="bold">Quick jobs &amp; debugging</text>
    <text x="795" y="126" text-anchor="middle" fill="#003366" font-size="13">Higher turnaround for</text>
    <text x="795" y="150" text-anchor="middle" fill="#003366" font-size="13">short-duration work</text>
    <line x1="675" y1="172" x2="915" y2="172" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="795" y="200" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Shorter max walltime</text>
    <text x="795" y="222" text-anchor="middle" fill="#003366" font-size="12" font-style="italic">check: sinfo -p short</text>
    <line x1="675" y1="244" x2="915" y2="244" stroke="#004B87" stroke-opacity="0.3"/>
    <text x="795" y="272" text-anchor="middle" fill="#003366" font-size="13" font-weight="bold">Best for:</text>
    <text x="795" y="296" text-anchor="middle" fill="#003366" font-size="13">Testing job scripts, debugging,</text>
    <text x="795" y="316" text-anchor="middle" fill="#003366" font-size="13">interactive sessions, prototyping</text>
  </g>
</svg>
