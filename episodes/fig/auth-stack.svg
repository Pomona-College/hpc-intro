<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Secure Authentication Stack</title>
  <desc>Three-layer authentication: Password, DUO MFA, SSH Keys converging to secure access</desc>
  <defs>
    <filter id="sh12" x="-4%" y="-3%" width="108%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arr12" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>
  </defs>

  <!-- Title -->
  <g filter="url(#sh12)">
    <rect x="100" y="10" width="300" height="42" rx="8" fill="#004B87" stroke="#003366" stroke-width="2"/>
    <text x="250" y="37" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Secure Authentication Stack</text>
  </g>

  <!-- Arrow down -->
  <path d="M 250,52 L 250,75" fill="none" stroke="#003366" stroke-width="1.5" marker-end="url(#arr12)"/>

  <!-- Layer 1: Strong Password -->
  <g filter="url(#sh12)">
    <rect x="50" y="80" width="400" height="90" rx="8" fill="#D4A843" stroke="#004B87" stroke-width="2"/>
    <rect x="50" y="80" width="400" height="32" rx="8" fill="#C49A38" stroke="none"/>
    <rect x="50" y="96" width="400" height="16" fill="#C49A38" stroke="none"/>
    <text x="70" y="102" fill="#000" font-size="15" font-weight="bold">Strong Password</text>
    <text x="80" y="132" fill="#000" font-size="13">14+ characters (NIST SP 800-63B)</text>
    <text x="80" y="152" fill="#000" font-size="13">Length over complexity</text>
  </g>

  <!-- Arrow -->
  <path d="M 250,170 L 250,195" fill="none" stroke="#003366" stroke-width="1.5" marker-end="url(#arr12)"/>

  <!-- Layer 2: DUO MFA -->
  <g filter="url(#sh12)">
    <rect x="50" y="200" width="400" height="90" rx="8" fill="#FD7E14" stroke="#004B87" stroke-width="2"/>
    <rect x="50" y="200" width="400" height="32" rx="8" fill="#E67110" stroke="none"/>
    <rect x="50" y="216" width="400" height="16" fill="#E67110" stroke="none"/>
    <text x="70" y="222" fill="#000" font-size="15" font-weight="bold">DUO MFA</text>
    <text x="80" y="252" fill="#000" font-size="13">Two-Factor Authentication</text>
    <text x="80" y="272" fill="#000" font-size="13">https://duo.pomona.edu</text>
  </g>

  <!-- Arrow -->
  <path d="M 250,290 L 250,315" fill="none" stroke="#003366" stroke-width="1.5" marker-end="url(#arr12)"/>

  <!-- Layer 3: SSH Keys -->
  <g filter="url(#sh12)">
    <rect x="50" y="320" width="400" height="90" rx="8" fill="#28A745" stroke="#004B87" stroke-width="2"/>
    <rect x="50" y="320" width="400" height="32" rx="8" fill="#239B3E" stroke="none"/>
    <rect x="50" y="336" width="400" height="16" fill="#239B3E" stroke="none"/>
    <text x="70" y="342" fill="#fff" font-size="15" font-weight="bold">SSH Keys</text>
    <text x="80" y="372" fill="#fff" font-size="13">Ed25519 preferred, RSA-4096 acceptable</text>
    <text x="80" y="392" fill="#fff" font-size="13">Encrypted passphrase required</text>
  </g>

  <!-- Converging arrows -->
  <path d="M 250,410 L 250,440" fill="none" stroke="#003366" stroke-width="2"/>
  <path d="M 150,410 L 250,440" fill="none" stroke="#003366" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M 350,410 L 250,440" fill="none" stroke="#003366" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Result: Secure Access -->
  <g filter="url(#sh12)">
    <rect x="100" y="445" width="300" height="55" rx="8" fill="#003366" stroke="#004B87" stroke-width="2"/>
    <text x="250" y="470" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Secure Access</text>
    <text x="250" y="490" text-anchor="middle" fill="#fff" font-size="12">Sagehen HPC Cluster</text>
  </g>
</svg>